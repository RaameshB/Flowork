<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- GNOME chin gradient: lighter side edges, darker bottom center -->
    <linearGradient id="chin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0bfbc"/>
      <stop offset="22%" stop-color="#77767b"/>
      <stop offset="78%" stop-color="#77767b"/>
      <stop offset="100%" stop-color="#c0bfbc"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#deddda"/>
      <stop offset="100%" stop-color="#c0bfbc"/>
    </linearGradient>
    <linearGradient id="button-profile" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0bfbc"/>
      <stop offset="50%" stop-color="#9a9996"/>
      <stop offset="100%" stop-color="#c0bfbc"/>
    </linearGradient>
    <linearGradient id="side-button-profile" href="#button-profile" gradientUnits="userSpaceOnUse" x1="57" y1="0" x2="71.707107" y2="0"/>
  </defs>

  <!-- Depth projects down the canvas, even when the button face is rotated. -->
  <!-- Matching the cap's depth keeps the stem and cap coaxial before projection. -->
  <path d="M 61 20 H 67 L 67.707107 20.707107 V 24.707107 H 61.707107 L 61 24 Z" fill="#77767b" stroke="#77767b" stroke-width="4" stroke-linejoin="round" transform="rotate(45 64 68)"/>
  <rect x="59" y="18" width="10" height="8" rx="2" fill="#77767b" transform="rotate(45 64 68)"/>
  <!-- Sweeping the rounded face through its depth fills the entire connecting sidewall. -->
  <path d="M 59.5 15.5 H 68.5 L 69.207107 16.207107 H 60.207107 Z" fill="url(#side-button-profile)" stroke="url(#side-button-profile)" stroke-width="5" stroke-linejoin="round" transform="rotate(45 64 68)"/>
  <rect x="57" y="13" width="14" height="5" rx="2.5" fill="#deddda" transform="rotate(45 64 68)"/>

  <!-- Crown -->
  <rect x="58" y="16" width="12" height="10" rx="2" fill="#77767b"/>
  <rect x="50" y="8" width="28" height="10" rx="4" fill="url(#button-profile)"/>
  <rect x="50" y="8" width="28" height="8" rx="4" fill="#deddda"/>

  <!-- Body: r=44 circle with 4px chin -->
  <circle cx="64" cy="72" r="44" fill="url(#chin)"/>
  <circle cx="64" cy="68" r="44" fill="url(#body)"/>

  <!-- Dial face -->
  <circle cx="64" cy="68" r="36" fill="#3d3846"/>

  <!-- Quarter ticks (3, 6, 9) -->
  <g fill="#77767b">
    <rect x="62.5" y="32.5" width="3" height="4" rx="1.5" transform="rotate(90 64 68)"/>
    <rect x="62.5" y="32.5" width="3" height="4" rx="1.5" transform="rotate(180 64 68)"/>
    <rect x="62.5" y="32.5" width="3" height="4" rx="1.5" transform="rotate(270 64 68)"/>
  </g>
  <!-- Static debt-side tick: marks which direction is "owed", not a second balance -->
  <rect x="62.5" y="32.5" width="3" height="4" rx="1.5" fill="#e01b24" transform="rotate(-30 64 68)"/>

  <!-- Balance track -->
  <circle cx="64" cy="68" r="24" fill="none" stroke="#241f31" stroke-width="7"/>

  <!-- Single signed balance: break credit, clockwise from 12:00 zero (140°) -->
  <path d="M 64 44 A 24 24 0 0 1 79.43 86.39" fill="none" stroke="#2ec27e" stroke-width="7"/>
  <circle cx="79.43" cy="86.39" r="3.5" fill="#2ec27e"/>

  <!-- Zero mark at 12:00 -->
  <rect x="62" y="38" width="4" height="12" rx="2" fill="#f6f5f4"/>

  <!-- Stopwatch hand with counterweight, independent of the balance -->
  <g transform="rotate(-55 64 68)">
    <rect x="62" y="52" width="4" height="22" rx="2" fill="#ffffff"/>
  </g>
  <circle cx="64" cy="68" r="5" fill="#ffffff"/>
  <circle cx="64" cy="68" r="2" fill="#3584e4"/>
</svg>
