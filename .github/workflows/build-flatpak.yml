name: Build Flatpak

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag (e.g. v0.1.0) to create a GitHub Release with the .flatpak bundle"
        required: false
        default: ""
        type: string
      draft_release:
        description: "Create the GitHub Release as a draft (when release_tag is set)"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Build Flowork Flatpak & Run Meson Tests
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: flowork-x86_64.flatpak
          artifact-name: flowork-x86_64
          manifest-path: build-aux/flatpak/io.github.raameshb.flowork.json
          arch: x86_64

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Flatpak bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: flowork-x86_64
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_release }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/flowork-x86_64.flatpak --clobber
          else
            args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
            if [ "$DRAFT" = "true" ]; then
              args+=(--draft)
            fi
            gh release create "$TAG" dist/flowork-x86_64.flatpak "${args[@]}"
          fi
